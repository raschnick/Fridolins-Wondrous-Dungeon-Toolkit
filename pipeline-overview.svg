<svg width="100%" viewBox="0 0 680 860" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Legend -->
<rect x="40" y="20" width="600" height="36" rx="8" fill="none" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<rect x="52" y="30" width="14" height="14" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="72" y="41">Trigger workflow</text>
<rect x="180" y="30" width="14" height="14" rx="3" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text class="ts" x="200" y="41">Reusable template</text>
<rect x="320" y="30" width="14" height="14" rx="3" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="340" y="41">CI job step</text>
<rect x="430" y="30" width="14" height="14" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="450" y="41">Repo structure</text>

<!-- ── TRIGGER 1: Push to feature branch ── -->
<g>
  <rect x="40" y="78" width="270" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="175" y="97" text-anchor="middle" fill="#0C447C">Push to feature branch</text>
  <text class="ts" x="175" y="115" text-anchor="middle" fill="#185FA5">dockerbuild/** or .gitea/workflows/**</text>
</g>

<!-- ── TRIGGER 2: PR merged to main ── -->
<g>
  <rect x="370" y="78" width="270" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="505" y="97" text-anchor="middle" fill="#0C447C">PR merged to main</text>
  <text class="ts" x="505" y="115" text-anchor="middle" fill="#185FA5">pull_request closed + merged == true</text>
</g>

<!-- Arrows down to templates -->
<line x1="175" y1="130" x2="175" y2="170" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
<line x1="505" y1="130" x2="505" y2="170" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
<text class="ts" x="190" y="154" fill="var(--color-text-secondary)">calls template</text>
<text class="ts" x="520" y="154" fill="var(--color-text-secondary)">calls template</text>

<!-- ── TEMPLATE A: build-scan ── -->
<g>
  <rect x="40" y="170" width="270" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="175" y="188" text-anchor="middle" fill="#27500A">template_build-scan.yaml</text>
  <text class="ts" x="175" y="204" text-anchor="middle" fill="#3B6D11">Build + scan only · tagged with git SHA</text>
</g>

<!-- ── TEMPLATE B: build-scan-push ── -->
<g>
  <rect x="370" y="170" width="270" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="505" y="188" text-anchor="middle" fill="#27500A">template_build-scan-push.yaml</text>
  <text class="ts" x="505" y="204" text-anchor="middle" fill="#3B6D11">Build + scan + push + git tag</text>
</g>

<!-- Arrows into shared block -->
<line x1="175" y1="214" x2="175" y2="256" stroke="var(--color-border-secondary)" stroke-width="1" fill="none"/>
<line x1="505" y1="214" x2="505" y2="256" stroke="var(--color-border-secondary)" stroke-width="1" fill="none"/>
<line x1="175" y1="256" x2="340" y2="256" stroke="var(--color-border-secondary)" stroke-width="1" fill="none"/>
<line x1="505" y1="256" x2="340" y2="256" stroke="var(--color-border-secondary)" stroke-width="1" fill="none"/>
<line x1="340" y1="256" x2="340" y2="272" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)" fill="none"/>

<!-- ── SHARED STEPS ── -->
<rect x="40" y="272" width="600" height="228" rx="12" fill="none" stroke="var(--color-border-tertiary)" stroke-width="1" stroke-dasharray="6 3"/>
<text class="ts" x="340" y="292" text-anchor="middle" fill="var(--color-text-secondary)">shared steps (both templates)</text>

<!-- Step 1: Checkout -->
<rect x="60" y="300" width="560" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="220" y="318" text-anchor="middle" fill="#633806">1. Checkout code</text>
<text class="ts" x="220" y="334" text-anchor="middle" fill="#854F0B">actions/checkout@v4  (fetch-depth: 0)</text>
<text class="ts" x="510" y="326" text-anchor="middle" fill="#854F0B">reads dockerbuild/</text>

<!-- Step 2: Docker build -->
<rect x="60" y="356" width="560" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="220" y="374" text-anchor="middle" fill="#633806">2. Docker build</text>
<text class="ts" x="220" y="390" text-anchor="middle" fill="#854F0B">docker build -f dockerbuild/Dockerfile  dockerbuild/</text>
<text class="ts" x="510" y="382" text-anchor="middle" fill="#854F0B">registry/repo:tag</text>

<!-- Step 3: Trivy scan -->
<rect x="60" y="412" width="560" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="200" y="430" text-anchor="middle" fill="#633806">3. Trivy security scan</text>
<text class="ts" x="200" y="446" text-anchor="middle" fill="#854F0B">vuln, secret, misconfig  ·  HIGH + CRITICAL  ·  exit-code 1</text>
<text class="ts" x="510" y="438" text-anchor="middle" fill="#854F0B">.trivyignore (optional)</text>

<!-- Scan gate -->
<rect x="200" y="468" width="280" height="16" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
<text class="ts" x="340" y="480" text-anchor="middle" fill="#791F1F">scan fails → pipeline stops ✗</text>

<!-- Arrow out of shared block — splits -->
<line x1="340" y1="500" x2="340" y2="528" stroke="var(--color-border-secondary)" stroke-width="1" fill="none"/>
<!-- left branch (feature) -->
<line x1="175" y1="528" x2="340" y2="528" stroke="var(--color-border-secondary)" stroke-width="1" fill="none"/>
<line x1="175" y1="528" x2="175" y2="560" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
<!-- right branch (main merge) -->
<line x1="340" y1="528" x2="505" y2="528" stroke="var(--color-border-secondary)" stroke-width="1" fill="none"/>
<line x1="505" y1="528" x2="505" y2="560" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)" fill="none"/>

<!-- ── FEATURE BRANCH OUTCOME ── -->
<rect x="40" y="560" width="270" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="175" y="578" text-anchor="middle" fill="#444441">Done ✓</text>
<text class="ts" x="175" y="594" text-anchor="middle" fill="#5F5E5A">Image validated, not published</text>

<!-- ── PR MERGE ONLY STEPS ── -->
<rect x="360" y="556" width="280" height="196" rx="12" fill="none" stroke="#9FE1CB" stroke-width="1" stroke-dasharray="6 3"/>
<text class="ts" x="500" y="576" text-anchor="middle" fill="#0F6E56">on PR merge only</text>

<!-- Step 4: Auto-tag -->
<rect x="376" y="584" width="248" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="500" y="602" text-anchor="middle" fill="#633806">4. Calculate next tag</text>
<text class="ts" x="500" y="618" text-anchor="middle" fill="#854F0B">latest git tag → patch++  (e.g. 1.2.3)</text>

<!-- Step 5: Docker login + push -->
<rect x="376" y="640" width="248" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="500" y="658" text-anchor="middle" fill="#633806">5. Docker login + push</text>
<text class="ts" x="500" y="674" text-anchor="middle" fill="#854F0B">docker push  registry/repo:1.2.3</text>

<!-- Step 6: Git tag -->
<rect x="376" y="696" width="248" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="500" y="714" text-anchor="middle" fill="#633806">6. Push git tag</text>
<text class="ts" x="500" y="730" text-anchor="middle" fill="#854F0B">git tag 1.2.3 → git push origin 1.2.3</text>

<!-- ── REPO STRUCTURE ── -->
<rect x="40" y="770" width="600" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="792" text-anchor="middle" fill="#085041">repo layout</text>
<text class="ts" x="175" y="812" text-anchor="middle" fill="#0F6E56">dockerbuild/  →  Dockerfile  +  src/</text>
<text class="ts" x="490" y="812" text-anchor="middle" fill="#0F6E56">.gitea/workflows/  →  triggers  +  templates</text>

</svg>