name: Build and Push on merge
on:
  push:
    branches-ignore:
      - main
    paths:
      - "dockerbuild/**"
      - ".gitea/workflows/**"

jobs:
  build-scan:
    uses: ./.gitea/workflows/template_build-scan.yaml
    with:
      IMAGE_NAME: ${{ gitea.repository }}
      IMAGE_TAG: ${{ github.sha }}
    secrets:
      CI_BOT_USERNAME: ${{ secrets.CI_BOT_USERNAME }}
      CI_BOT_GENERAL_CI_TOKEN: ${{ secrets.CI_BOT_GENERAL_CI_TOKEN }}
