name: Build-scan-push

on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        required: true
        type: string
      IMAGE_TAG:
        required: true
        type: string
      DOCKER_REGISTRY:
        required: false
        type: string
        default: "cb.van-de-loo.ch"
      DOCKERBUILD_PATH:
        required: false
        type: string
        default: "dockerbuild"
      DOCKERFILE:
        required: false
        type: string
        default: "Dockerfile"
      TRIVY_SCANNERS:
        required: false
        type: string
        default: "vuln,secret,misconfig"
      TRIVY_SEVERITY:
        required: false
        type: string
        default: "HIGH,CRITICAL"
      TRIVY_IGNORE_VULNS:
        required: false
        type: string
        default: ""
    secrets:
      CI_BOT_USERNAME:
        required: true
      CI_BOT_GENERAL_CI_TOKEN:
        required: true

jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: |
          docker build -f "${{ inputs.DOCKERBUILD_PATH }}/${{ inputs.DOCKERFILE }}" -t "${{ inputs.DOCKER_REGISTRY }}/${{ inputs.IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}" "${{ inputs.DOCKERBUILD_PATH }}"

      - name: Download Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Write Trivy ignore list
        if: ${{ inputs.TRIVY_IGNORE_VULNS != '' }}
        run: echo "${{ inputs.TRIVY_IGNORE_VULNS }}" | tr ',' '\n' > .trivyignore

      - name: Scan Docker image with Trivy
        run: |
          trivy image \
            --exit-code 1 \
            --scanners ${{ inputs.TRIVY_SCANNERS }} \
            --severity ${{ inputs.TRIVY_SEVERITY }} \
            --cache-dir .trivycache/ \
            --no-progress \
            "${{ inputs.DOCKER_REGISTRY }}/${{ inputs.IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}"
